{% extends 'base.html' %}
{% block title %} YuTabe {% endblock %}
{% block content %}
    <H1>Your history</H1>
    <div>
       {% if history %}
      <ul>
        {% for video in history %}
        <li>
          <a href="{% url 'video_detail' video.pk %}">
            <video controls>
              <source src="{{ video.video_file.url }}" type="video/mp4">
            </video>
          </a>
            <p>Просмотренo: {{ video.viewed_at|date:"d.m.Y H:i"}}</p>
        </li>
        {% endfor %}
      </ul>
        {% else %}
        <p>Вы ещё ничего не смотрели</p>
      {% endif %}
    </div>
{% endblock %}
