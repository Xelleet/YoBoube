{% extends "base.html" %}
{% load static %}
{% block title %}Редактировать профиль{% endblock %}

{% block content %}
<!-- Контейнер страницы -->
<div class="flex h-screen">
  <!-- Основной контент -->
  <main class="bg-gradient-to-b from-gray-900 to-black text-white flex-1 overflow-auto">
    <div class="container mx-auto px-4 py-12">
      <h2 class="text-3xl font-extrabold mb-8 flex items-center justify-center bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">
        Редактировать профиль
      </h2>

      <form method="post" enctype="multipart/form-data"
            class="max-w-lg mx-auto p-6 bg-gray-800 rounded-xl shadow-lg border border-gray-700 transition-all">
        {% csrf_token %}
        <div class="space-y-6">
          {{ form.as_p }}
        </div>
        <div class="mt-6">
          <button type="submit"
                  class="w-full py-2 px-4 bg-gradient-to-r from-pink-600 to-indigo-600 hover:from-pink-700 hover:to-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-300 transform hover:scale-105 focus:outline-none">
            Сохранить изменения
          </button>
            <a href="{% url 'user_profile' profile.id %}">Назад</a>
        </div>
      </form>
    </div>
  </main>
</div>
{% endblock %}
